[pytest]
testpaths = tests
addopts = --ignore=tests/test_pipeline.py
python_files = test_*.py
python_functions = test_*
filterwarnings =
    error
    ignore:.*audioop.*:DeprecationWarning
    ignore:.*StarletteDeprecationWarning.*:Warning
    ignore:.*httpx.*:Warning
    ignore:.*huggingface_hub.*:UserWarning

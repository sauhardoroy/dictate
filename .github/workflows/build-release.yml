name: Build & Release Dictate (Windows & macOS)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          python build.py --clean

      - name: Package Windows ZIP
        run: |
          cd dist
          Compress-Archive -Path Dictate -DestinationPath Dictate-Windows-x64.zip
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dictate-Windows-x64
          path: dist/Dictate-Windows-x64.zip

  build-macos:
    name: Build macOS DMG & App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App & DMG
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dictate-macOS-DMG
          path: dist/Dictate-macOS.dmg

      - name: Upload macOS ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dictate-macOS-ZIP
          path: dist/Dictate-macOS.zip

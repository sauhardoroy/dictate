<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictate Settings & History</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="brand">
        <div class="logo-icon">💧</div>
        <div>
          <h1>Dictate</h1>
          <p>Apple Liquid Glass Voice Typing</p>
        </div>
      </div>
      <button id="btn-toggle-recording" class="btn-record" title="Toggle Dictation">
        🎙 Start
      </button>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-settings">⚙️ Settings</button>
      <button class="tab-btn" data-tab="tab-history">📜 History</button>
    </div>

    <!-- Settings Tab -->
    <div id="tab-settings" class="tab-pane active">
      <!-- General Settings -->
      <div class="card">
        <div class="card-title">Dictation & Display</div>

        <div class="form-row">
          <label for="show-pill">Floating Liquid Glass Pill</label>
          <input type="checkbox" id="show-pill" class="toggle-switch">
        </div>

        <div class="form-row">
          <label for="voice-commands">Voice Punctuation Commands</label>
          <input type="checkbox" id="voice-commands" class="toggle-switch">
        </div>

        <div class="form-row">
          <label for="language">Speech Language</label>
          <select id="language" class="input-select">
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="es-ES">Spanish</option>
            <option value="fr-FR">French</option>
            <option value="de-DE">German</option>
            <option value="it-IT">Italian</option>
            <option value="ja-JP">Japanese</option>
            <option value="zh-CN">Chinese (Mandarin)</option>
            <option value="hi-IN">Hindi</option>
          </select>
        </div>

        <div class="shortcut-badge">
          <span>Global Shortcut:</span>
          <kbd>Ctrl+Shift+P</kbd>
        </div>
      </div>

      <!-- NVIDIA AI Polish Settings -->
      <div class="card">
        <div class="card-title">
          <span>⚡ NVIDIA AI Cloud Polish</span>
          <input type="checkbox" id="ai-polish" class="toggle-switch">
        </div>

        <div id="ai-fields" class="sub-form">
          <div class="notice">
            Removes filler words & corrects grammar via NVIDIA NIM. Get a free key at <a href="https://build.nvidia.com/" target="_blank">build.nvidia.com</a>.
          </div>

          <div class="form-group">
            <label for="ai-api-key">NVIDIA API Key</label>
            <input type="password" id="ai-api-key" placeholder="nvapi-..." class="input-text">
          </div>

          <div class="form-group">
            <label for="ai-model">NVIDIA Model</label>
            <select id="ai-model" class="input-select">
              <option value="nvidia/nemotron-3-nano-30b-a3b">nvidia/nemotron-3-nano-30b-a3b</option>
              <option value="meta/muse-glimmer-30b">meta/muse-glimmer-30b</option>
            </select>
          </div>
        </div>
      </div>

      <button id="btn-save-settings" class="btn-primary">Save Settings</button>
    </div>

    <!-- History Tab -->
    <div id="tab-history" class="tab-pane">
      <div class="history-actions">
        <span id="history-count">0 transcripts</span>
        <button id="btn-clear-history" class="btn-text">Clear History</button>
      </div>

      <div id="history-list" class="history-list">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
